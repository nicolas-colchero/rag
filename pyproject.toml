[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "faiss-cpu>=1.15.0",
    "numpy>=2.5.2",
    "pymupdf>=1.28.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.0",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
